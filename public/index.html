<style>
:root{--orange:#FB6836;--orange-dark:#E2542A;--ink:#1E1A17;--muted:#7A6F69;--bg:#FFF6F1;--card:#FFFFFF;--line:#F3E3DA}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Tajawal","Segoe UI",Tahoma,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.hero{background:var(--orange);color:#fff;padding:max(28px,env(safe-area-inset-top)) 20px 64px;text-align:center;border-radius:0 0 36px 36px;position:relative;overflow:hidden}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.08)}
.hero::before{width:260px;height:260px;top:-120px;right:-80px}.hero::after{width:180px;height:180px;bottom:-90px;left:-40px}
.hero .badge{width:156px;height:156px;border-radius:44px;background:#fff;box-shadow:0 14px 36px rgba(120,40,10,.28),0 0 0 8px rgba(255,255,255,.18);display:grid;place-items:center;margin:0 auto 18px;position:relative}
.hero .badge img{width:112px;height:auto;display:block}
.hero h1{margin:0;font-size:22px;font-weight:800;letter-spacing:.2px;position:relative}
.hero p{margin:8px auto 0;max-width:340px;font-size:15px;opacity:.95;line-height:1.6;position:relative}
main{max-width:520px;margin:-40px auto 0;padding:0 16px 40px;position:relative}
.card{background:var(--card);border-radius:20px;box-shadow:0 8px 28px rgba(226,84,42,.10);padding:16px 16px 14px;margin-bottom:14px;border:1px solid var(--line)}
.bank{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.bank .logo{width:118px;height:52px;border-radius:12px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;padding:6px 8px;flex:none}
.bank .logo img{width:100%;height:40px;object-fit:contain;display:block}
.bank .ic{width:38px;height:38px;border-radius:12px;background:#FFF0E9;display:grid;place-items:center;color:var(--orange);flex:none}
.bank h2{margin:0;font-size:17px;font-weight:700}
.bank small{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}
.row{display:grid;grid-template-columns:1fr auto;grid-template-areas:"lbl btn" "num btn";align-items:center;column-gap:10px;row-gap:2px;background:#FFFAF7;border:1px dashed #F6CDBB;border-radius:14px;padding:9px 12px;margin-top:8px;cursor:pointer;transition:background .15s}
.row:active{background:#FFEFE5}
.row .lbl{grid-area:lbl;font-size:11.5px;color:var(--muted);line-height:1.2}
.row .num{grid-area:num;direction:ltr;text-align:right;font-family:"SF Mono",Menlo,Consolas,"Courier New",monospace;font-size:18px;font-weight:700;letter-spacing:.04em;white-space:nowrap;overflow-x:auto;color:var(--ink);font-variant-numeric:tabular-nums;user-select:all;-webkit-user-select:all;line-height:1.3}
.row .num.iban{font-size:14px;font-weight:600;letter-spacing:.02em;white-space:normal;line-height:1.35}
.btn{grid-area:btn;flex:none;border:0;background:var(--orange);color:#fff;font-family:inherit;font-weight:700;font-size:14px;padding:9px 14px;border-radius:11px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;box-shadow:0 3px 10px rgba(251,104,54,.28)}
.btn:active{background:var(--orange-dark);transform:translateY(1px)}
.btn.ghost{background:#fff;color:var(--orange);border:1.5px solid #F6CDBB;box-shadow:none}
.btn svg{width:15px;height:15px}
.note{text-align:center;color:var(--muted);font-size:13px;line-height:1.7;margin:22px 8px 0}
.note b{color:var(--orange-dark)}
footer{text-align:center;color:var(--muted);font-size:12px;padding:8px 0 max(20px,env(safe-area-inset-bottom))}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:all .22s;z-index:9;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (min-width:600px){.hero{padding-top:44px}.hero .badge{width:176px;height:176px}.hero .badge img{width:128px}.hero h1{font-size:26px}}
@media print{.hero{border-radius:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}.btn,#toast{display:none}.card{box-shadow:none;break-inside:avoid}}
</style>

const COPY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
const main = document.getElementById("accounts");
main.innerHTML = BANKS.map((b,i)=>`
  <section class="card">
    <div class="bank"><div class="logo"><img src="${b.logo}" alt="${b.name}" loading="lazy" onerror="this.parentNode.outerHTML='<div class=ic>'+ICON+'</div>'"></div><div><h2>${b.name}</h2><small>رقم الحساب${b.iban?" · IBAN":""}</small></div></div>
    <div class="row" data-copy="${b.acc}"><span class="lbl">رقم الحساب</span><span class="num">${b.acc}</span><button class="btn" type="button">${COPY} نسخ</button></div>
    ${b.iban?`<div class="row" data-copy="${b.iban}"><span class="lbl">IBAN</span><span class="num iban">${b.iban.replace(/(.{4})/g,"$1 ").trim()}</span><button class="btn ghost" type="button">${COPY} نسخ</button></div>`:""}
  </section>`).join("") +
  `<p class="note">يرجى <b>التأكد من اسم المصرف ورقم الحساب</b> قبل إتمام الحوالة، والاحتفاظ بإيصال التحويل.</p>
   <footer>الهاني مول © ${new Date().getFullYear()}</footer>`;

function copyText(t){
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(t);
  return new Promise((res,rej)=>{ const ta=document.createElement("textarea"); ta.value=t; ta.setAttribute("readonly",""); ta.style.cssText="position:fixed;opacity:0;top:0"; document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0,99999); try{document.execCommand("copy")?res():rej()}catch(e){rej(e)} document.body.removeChild(ta); });
}
let tm; function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(tm); tm=setTimeout(()=>t.classList.remove("show"),1600); }
document.querySelectorAll(".row").forEach(row=>{
  row.addEventListener("click",()=>copyText(row.dataset.copy).then(()=>toast("✓ تم نسخ "+row.dataset.copy)).catch(()=>toast("حدد الرقم وانسخه يدوياً")));
});
</script>
</body>
</html>
